<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Theory Arena</title>
<meta name="description" content="70 real-world strategy games with real stakes in dollars and years. Make your move, see the other side's, and get a grade.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
<a class="skip-link" href="#app">Skip to content</a>
<header class="topbar">
  <button class="brand" data-action="home" aria-label="Game Theory Arena home">
    <span class="brand-mark" aria-hidden="true">🎯</span><span class="brand-name">Game Theory Arena</span>
  </button>
  <div class="topbar-right">
    <span class="pill" id="overall" hidden></span>
    <button class="btn btn-ghost btn-sm" data-action="browse">☰ All games</button>
  </div>
</header>
<div class="run-progress" aria-hidden="true"><div id="run-bar"></div></div>

<main id="app" tabindex="-1"></main>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<aside class="sheet" id="sheet" aria-label="All games" aria-hidden="true">
  <div class="sheet-head">
    <input class="search" id="search" type="search" placeholder="Search all games…" aria-label="Search games">
    <button class="btn btn-ghost btn-sm" data-action="close-sheet" aria-label="Close">✕</button>
  </div>
  <div class="sheet-list" id="sheet-list"></div>
</aside>

<div class="confetti" id="confetti" aria-hidden="true"></div>
<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
